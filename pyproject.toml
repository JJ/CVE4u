[project]
name = "cve4u"
version = "0.1.0"
description = "Plataforma web para encontrar CVEs relevantes en competiciones CTF"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
cve4u = "cve4u:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
