[project]
name = "cve4u"
version = "0.1.0"
description = "Web platform to find relevant CVEs in CTF competitions"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP 8)
    "W",   # pycodestyle warnings (PEP 8)
    "F",   # Pyflakes (logical errors, unused imports)
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (potential bugs and design issues)
    "UP",  # pyupgrade (modern Python syntax)
    "S",   # flake8-bandit (security static analysis)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
