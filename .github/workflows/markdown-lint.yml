name: Markdown lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown files (markdownlint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv for linting
        uses: astral-sh/setup-uv@v7

      - name: Install Python and its dependencies
        run: uv sync --locked

      - name: Run the lint-md task
        run: uv run poe lint-md
