name: Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv for linting
        uses: astral-sh/setup-uv@v7

      - name: Install Python and its dependencies
        run: uv sync --locked

      - name: Run linter (we're currently using Ruff)
        run: uv run ruff check .
