name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pytest:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv for running tests
        uses: astral-sh/setup-uv@v7

      - name: Install Python and its dependencies
        run: uv sync --locked

      - name: Run tests with pytest
        run: uv run pytest || [ $? -eq 5 ]
